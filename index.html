function blank(){return {version:3,history:{},errors:{}}}
function restoreProgress(source){
  const restored=blank();
  for(const [oldId,value] of Object.entries(source.history)){
    const id=String(DUPLICATES[oldId] ?? oldId);
    if(!INDEX.has(id) || !value || typeof value!=='object')continue;
    const prior=restored.history[id];
    const at=Number(value.at)||0;
    restored.history[id]={
      right:(prior?.right||0)+(Number(value.right)||0),
      wrong:(prior?.wrong||0)+(Number(value.wrong)||0),
      last:prior && prior.at>at ? prior.last : value.last==='right'?'right':'wrong',
      at:Math.max(prior?.at||0,at)
    };
  }
  for(const [oldId,value] of Object.entries(source.errors)){
    const id=String(DUPLICATES[oldId] ?? oldId);
    if(INDEX.has(id) && value)restored.errors[id]=Math.max(restored.errors[id]||0,Number(value)||Date.now());
  }
  return restored;
}

if(q.y==='m'){$('choices').querySelectorAll('button').forEach(b=>{b.disabled=true;const idx=Number(b.dataset.index);if(idx===q.a)b.classList.add('correct');else if(idx===selected)b.classList.add('incorrect')});}
else {const selects=[...$('app').querySelectorAll('[data-pick]')];for(const sel of selects){const row=sel.closest('.match-row'),idx=session.currentOrder[Number(sel.dataset.pick)],right=String(q.p[idx][1]),correct=sel.value===right;if(selected==='dontknow'){row.classList.add('isbad')}else row.classList.add(correct?'isgood':'isbad');if(!correct||selected==='dontknow'){const hint=row.querySelector('.correct-label');hint.textContent='Правильно: '+right;hint.classList.remove('hidden')}sel.disabled=true}}
let message=ok?'Верно!':'Вопрос добавлен в «Мои ошибки».';let detail=ok?'Ответ засчитан.':q.y==='m'?'Правильный ответ: '+safe(q.o[q.a]):'Правильные ответы показаны в строках с ошибками.';
$('feedback').innerHTML=`<div class="feedback ${ok?'good':'bad'}">${message}<small>${detail}</small>${q.n===296?'<small>В ключе PDF указан ответ «Гипотермия». По конспекту блокада D2-рецепторов полосатого тела связана с экстрапирамидными нарушениями, а гипотермия — с блокадой D2-рецепторов гипоталамуса.</small>':''}</div>`;$('dontknow').classList.add('hidden');if($('check'))$('check').classList.add('hidden');$('next').classList.remove('hidden');$('next').focus({preventScroll:true});nav()}
function nextQuestion(){session.at++;session.currentOrder=null;session.selected=null;session.answered=false;render();window.scrollTo({top:0,behavior:'instant'})}
function end(){if(!session){go('home');return}let total=session.ids.length;let {correct,wrong,origin}=session;$('app').innerHTML=`<div class="card session-fin"><div class="pill">БЛОК ЗАВЕРШЁН</div><div class="huge">${correct} / ${total}</div><h2>${correct===total?'Отлично, всё правильно!':'Результат блока'}</h2><p>${origin.kind==='errors'?'Верные ответы убраны из ошибок, остальные остались для следующего повторения.':'Все неверные ответы собраны в «Мои ошибки» — отдельно от новых вопросов.'}</p><div class="breakdown"><div><b>${correct}</b><span>Верно</span></div><div><b>${wrong}</b><span>Ошибки в блоке</span></div><div><b>${Object.keys(data.errors).length}</b><span>Всего на повтор</span></div></div><div class="actions"><button class="primary" id="redo">${origin.kind==='errors'?'Повторить оставшиеся ошибки':'Следующие вопросы'}</button><button class="secondary" id="review">Мои ошибки</button><button class="ghost" id="back">К темам</button></div></div>`;
$('redo').onclick=()=>{if(origin.kind==='errors')startMistakes(origin.topic);else startTopic(origin.topic)};$('review').onclick=()=>go('errors');$('back').onclick=()=>go('home')}
function errors(){let all=QUESTIONS.filter(inErrors);let shown=all.filter(q=>errFilter==='all'||q.t===errFilter).sort((a,b)=>(data.errors[String(b.n)]||0)-(data.errors[String(a.n)]||0));$('app').innerHTML=`<div class="intro"><div><h2>Мои ошибки</h2><p>Здесь только те вопросы, на которые был дан неправильный ответ. Они не возвращаются в поток новых заданий.</p></div><span class="pill">${all.length} на повтор</span></div>
${all.length?`<div class="error-controls"><div class="field" style="max-width:350px"><label for="errorTopic">Тема ошибок</label><select id="errorTopic"><option value="all">Все темы (${all.length})</option>${TOPIC_ORDER.map(t=>`<option value="${t}">${TOPICS[t]} (${all.filter(q=>q.t===t).length})</option>`).join('')}</select></div><div class="actions"><button class="primary" id="practiceErrors" ${shown.length?'':'disabled'}>Повторить ${shown.length} ошибок</button><button class="danger" id="clearErrors">Очистить список</button></div></div><div class="error-list">${shown.map(q=>`<div class="card error-row"><div class="error-title"><b>№ ${q.n} · ${safe(fmtTopic(q))}</b><p>${safe(q.q)}</p></div><div class="actions"><button type="button" class="secondary" data-practice="${q.n}">Повторить</button><button type="button" class="ghost" data-remove="${q.n}">Убрать</button></div></div>`).join('')}</div>`:`<div class="card empty"><div class="ico">✓</div><h3>Пока ошибок нет</h3><p>Как только ответишь неправильно, этот вопрос окажется здесь. После правильного повтора он исчезнет из списка.</p><button class="primary" id="goTopics">К вопросам по темам</button></div>`}
<p class="footer">При правильном ответе в разделе «Мои ошибки» вопрос удаляется из этого списка. Неверные ответы остаются на следующий повтор.</p>`;
if(!all.length){$('goTopics').onclick=()=>go('home');return}
$('errorTopic').value=errFilter;$('errorTopic').onchange=e=>{errFilter=e.target.value;errors()};$('practiceErrors').onclick=()=>startMistakes(errFilter);$('clearErrors').onclick=()=>{if(confirm('Очистить все накопленные ошибки? История отвеченных вопросов останется.')){data.errors={};save();errors();nav();toast('Ошибки очищены')}};
$('app').querySelectorAll('[data-practice]').forEach(b=>b.onclick=()=>startMistakes('all',Number(b.dataset.practice)));
$('app').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{delete data.errors[b.dataset.remove];save();errors();nav()})}
function settings(){const d=countSeen(QUESTIONS),bad=countErr(QUESTIONS),right=QUESTIONS.filter(q=>data.history[String(q.n)]&&data.history[String(q.n)].last==='right').length;$('app').innerHTML=`<div class="intro"><div><h2>Прогресс и настройки</h2><p>Статистика, резервная копия и сброс заданий.</p></div></div>
<div class="stats">${sCard(d,'Отвечено из 530')}${sCard(right,'Последний ответ правильный')}${sCard(bad,'Неисправленных ошибок')}</div>
<div class="settings-grid"><div class="card"><h3>Сохранить прогресс</h3><p>Скачай файл с ответами и ошибками, чтобы перенести тренажёр на другой телефон или восстановить всё после очистки браузера.</p><div class="actions"><button class="primary" id="export">Скачать прогресс</button><button class="secondary" id="import">Загрузить прогресс</button></div></div><div class="card"><h3>Сбросить тест</h3><p>Полный сброс удалит историю ответов и список ошибок. После этого все 545 вопросов снова будут считаться новыми.</p><div class="actions"><button class="danger" id="resetAll">Сбросить всё</button><button class="secondary" id="resetErrors">Только ошибки</button></div></div></div>
<div class="sectionline"><h3>По темам</h3><span>Отвечено / всего</span></div><div class="topics">${TOPIC_ORDER.map(t=>{let xs=byTopic(t),d=countSeen(xs),e=countErr(xs);return `<div class="topic" style="cursor:default"><div class="topic-head"><strong>${TOPICS[t]}</strong><span class="count">${d} / ${xs.length}</span></div><div class="track"><div class="fill" style="width:${badgePercent(d,xs.length)}%"></div></div><div class="topic-foot"><span>${badgePercent(d,xs.length)}% пройдено</span><em>${e} ошибок</em></div></div>`}).join('')}</div><p class="footer">Работает без интернета. Вопросы и ключи сохранены непосредственно в HTML-файле. Если браузер не сохраняет данные между открытиями локального файла, используйте «Скачать прогресс».</p>`;
$('export').onclick=exportData;$('import').onclick=()=>$('upload').click();$('resetAll').onclick=()=>{if(confirm('Точно удалить ВСЕ ответы и ошибки и сделать 530 вопросов новыми?')){data=blank();save();nav();settings();toast('Прогресс полностью сброшен')}};$('resetErrors').onclick=()=>{if(confirm('Очистить список ошибок?')){data.errors={};save();nav();settings();toast('Ошибки сброшены')}}}
function exportData(){let payload=JSON.stringify({app:'farma-rk2',savedAt:new Date().toISOString(),...data},null,2);let blob=new Blob([payload],{type:'application/json;charset=utf-8'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='РК2_фарма_мой_прогресс.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
$('upload').addEventListener('change',async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(obj.app!=='farma-rk2'||!obj.history||!obj.errors||typeof obj.history!=='object'||typeof obj.errors!=='object')throw Error('Неизвестный формат');if(!confirm('Заменить текущий прогресс данными из выбранного файла?'))return;data=restoreProgress(obj);save();render();toast('Прогресс загружен')}catch(err){alert('Не удалось загрузить прогресс: '+err.message)}finally{e.target.value=''}});
document.addEventListener('keydown',e=>{if(screen!=='quiz'||!session||session.answered||e.altKey||e.ctrlKey||e.metaKey)return;let q=question();if(q.y!=='m'||/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName))return;let idx=Number(e.key)-1;if(Number.isInteger(idx)&&idx>=0&&idx<session.currentOrder.length){const el=$('choices').querySelectorAll('button')[idx];if(el){e.preventDefault();el.click()}}});
render();
</script></body></html>
